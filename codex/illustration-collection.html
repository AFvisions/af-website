<!DOCTYPE html>
<!--
  Collection page built from the template in codex/halloween-cards.html.
  See the note at the top of that file for how to add a card and swap placeholders for images.
  These pieces have no back, so they don't flip and the pop-up shows the front alone.
  To give a piece a back, copy a .postcard__back span from the Halloween page.
-->
<html lang="en" class="site">

<head>
    <!-- Google Tag Manager (skipped on local previews so they don't count as visits) -->

            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-TBSSBW57');</script>
    <!-- End Google Tag Manager -->

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MT9WN4B9BP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) gtag('config', 'G-MT9WN4B9BP');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustration Collection – Codex | AFvisions</title>
    <meta name="description" content="Illustration Collection: a series of illustrations by Andrew Fumagalli.">

    <link rel="stylesheet" href="/css/site.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@1,400&family=Inter:wght@400;500;600&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    <script src="/js/include.js" defer></script>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TBSSBW57" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div data-include="header"></div>

    <main class="page container">
        <a class="text-link back-link" href="/index.html#codex">← Back to the Codex</a>

        <!-- Intro: title, blurb and tags -->
        <section class="collection-intro panel" aria-labelledby="collection-title">
            <h1 class="t-page-title" id="collection-title">Illustration Collection</h1>
            <p class="t-body">[A short intro to the series: what it is, why you made it, and the tools you used.]</p>
            <ul class="tags tags--page" aria-label="Categories">
                <li class="tag">Illustration</li>
            </ul>
        </section>

        <!-- Pieces, newest first. A click opens the pop-up. -->
        <ul class="collection-grid" data-collection>
                <li>
                    <figure>
                        <button class="postcard" type="button" aria-label="Open [Piece 1]">
                            <span class="postcard__inner">
                                <span class="postcard__face postcard__front placeholder--lavender" role="img"
                                    aria-label="[Placeholder: illustration 1]">
                                    <span class="placeholder-text">[Piece 1]</span>
                                </span>
                            </span>
                        </button>
                        <figcaption class="t-caption">[Piece 1 title, year]</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <button class="postcard" type="button" aria-label="Open [Piece 2]">
                            <span class="postcard__inner">
                                <span class="postcard__face postcard__front placeholder--lavender" role="img"
                                    aria-label="[Placeholder: illustration 2]">
                                    <span class="placeholder-text">[Piece 2]</span>
                                </span>
                            </span>
                        </button>
                        <figcaption class="t-caption">[Piece 2 title, year]</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <button class="postcard" type="button" aria-label="Open [Piece 3]">
                            <span class="postcard__inner">
                                <span class="postcard__face postcard__front placeholder--lavender" role="img"
                                    aria-label="[Placeholder: illustration 3]">
                                    <span class="placeholder-text">[Piece 3]</span>
                                </span>
                            </span>
                        </button>
                        <figcaption class="t-caption">[Piece 3 title, year]</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <button class="postcard" type="button" aria-label="Open [Piece 4]">
                            <span class="postcard__inner">
                                <span class="postcard__face postcard__front placeholder--lavender" role="img"
                                    aria-label="[Placeholder: illustration 4]">
                                    <span class="placeholder-text">[Piece 4]</span>
                                </span>
                            </span>
                        </button>
                        <figcaption class="t-caption">[Piece 4 title, year]</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <button class="postcard" type="button" aria-label="Open [Piece 5]">
                            <span class="postcard__inner">
                                <span class="postcard__face postcard__front placeholder--lavender" role="img"
                                    aria-label="[Placeholder: illustration 5]">
                                    <span class="placeholder-text">[Piece 5]</span>
                                </span>
                            </span>
                        </button>
                        <figcaption class="t-caption">[Piece 5 title, year]</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <button class="postcard" type="button" aria-label="Open [Piece 6]">
                            <span class="postcard__inner">
                                <span class="postcard__face postcard__front placeholder--lavender" role="img"
                                    aria-label="[Placeholder: illustration 6]">
                                    <span class="placeholder-text">[Piece 6]</span>
                                </span>
                            </span>
                        </button>
                        <figcaption class="t-caption">[Piece 6 title, year]</figcaption>
                    </figure>
                </li>
        </ul>

    </main>

    <!-- Pop-up: shows the piece (and its back, if it has one). Filled in by js/collection.js from the card that was clicked. -->
    <dialog class="lightbox" aria-labelledby="postcard-caption" data-postcard-view>
        <!-- Close: sits at the window's top-right, above the image. -->
        <button class="lightbox__close" type="button" aria-label="Close" data-postcard-close>×</button>
        <figure class="lightbox__figure">
            <div class="lightbox__pair">
                <div class="lightbox__side" data-side="front">
                    <img class="lightbox__img" src="" alt="" hidden>
                    <span class="lightbox__placeholder" hidden></span>
                </div>
                <div class="lightbox__side" data-side="back">
                    <img class="lightbox__img" src="" alt="" hidden>
                    <span class="lightbox__placeholder" hidden></span>
                </div>
            </div>
            <figcaption class="lightbox__caption" id="postcard-caption"></figcaption>
        </figure>
    </dialog>

    <div data-include="footer"></div>
    <script src="/js/collection.js" defer></script>
</body>

</html>
