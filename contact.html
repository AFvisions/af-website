    <main class="page container">

        <!-- Contact: portrait on the left, email section on the right -->
        <section class="contact panel" aria-labelledby="contact-title">

            <!-- Temporary portrait, cropped from the archived about-me collage.
                 Replace with your own: <img src="/images/[file]" alt="[Description]"> -->
            <div class="contact__portrait placeholder--night">
                <img src="/images/contact-portrait.png" width="320" height="320"
                    alt="[Andrew smiling, holding a laptop, in a gray T-shirt with an orca design]">
            </div>

            <div class="contact__body">
                <h1 class="t-page-title" id="contact-title">Contact</h1>
                <p class="t-body">[Have a project in mind, or want to talk shop? Send me a note and I’ll get back to you.]</p>

                <div class="field">
                    <h2 class="t-label">Email</h2>
                    <!-- Put your address in both places: href="mailto:..." and the link text. -->
                    <a class="text-link contact__email" href="mailto:[your email address]">[your email address]</a>
                </div>

                <div class="field">
                    <h2 class="t-label">Elsewhere</h2>
                    <div class="contact__links">
                        <a class="text-link" href="https://www.linkedin.com/in/andrewfumagalli/">LinkedIn →</a>
                        <a class="text-link" href="https://github.com/AFvisions">GitHub →</a>
                    </div>
                </div>
            </div>
        </section>
